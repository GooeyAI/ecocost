    region: {value: US, tier: 3, source: https://docs.fireworks.ai/deployments/regions, candidates: {US-SW: 2, US-CA: 2, US-SE: 2, US-OHV: 3, US-MIDW: 2, US-NY: 1, US-VA: 1, US-NW: 3}, note: "26 on-demand regions; neither the cloud/facility behind each nor which serve serverless is disclosed. Candidates are the 16 US ones by count (AZ 2, CA 2, GA 2, IL 2, IA 1, MN 1, NY 1, OH 1, VA 1, WA 3), checked 2026-09-22. Left out: British Columbia 3, Iceland 2, Frankfurt, Tokyo 2, Malaysia, New South Wales. BC and Iceland are near-zero-carbon, so leaving them out errs high."}
    hardware: {value: h100-sxm, tier: 2, candidates: {h100-sxm: 3, h200-sxm: 2, b200-sxm: 2, mi325x: 1}, source: https://docs.fireworks.ai/faq/deployment/ondemand/hardware-options, note: "Fleet published (A100, H100/H200, B200/B300, MI325X/MI350X; docs checked 2026-09-22) but which chips serve serverless is not. Weights by count with H100 favoured as the installed base; A100 left out as unlikely for current serverless models."}
    pue:
      value: 1.2
      min: 1.09
      max: 1.45
      unit: ratio
      tier: 3
      source: https://docs.fireworks.ai/deployments/regions
      note: "Fireworks names no cloud or facility for any of its 26 regions (docs checked 2026-09-22). Three Washington and three British Columbia regions plus an AMD MI325X region in Arizona point to neocloud or colocation floors alongside hyperscalers, so the fleet is treated as mixed: min Google fleet 1.09, max Uptime >=20 MW average 1.44. An earlier note claiming AWS/GCP/Azure/OCI was an inference, not a disclosure."
    wue_l_per_kwh: *wue_mixed_fleet
    decode_utilization: *decode_default
    prefill_utilization: *prefill_default
    serving_overhead: *overhead_default
    provenance: {generated: {by: agent:claude-fable-5-1, at: 2026-09-18}, verified: [], status: draft, stale_after: 2027-03-31}

