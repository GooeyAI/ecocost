# Electricity regions. Annual averages; hourly data is a v2 upgrade.
# Location-based accounting throughout (physical grid, not renewable contracts).
# Carbon: lifecycle basis everywhere. Countries are Ember lifecycle via OWID (2025).
#   US subregions are EPA eGRID2023 direct-combustion rates raised to Ember's basis
#   by the same-year national ratio (see each note), so they are tier 2, not tier 1.
# Mix: Ember via OWID for countries, eGRID2023 Table 2 for US subregions. Display only;
#   carbon comes from the intensity figure, never from mix x factor.
# Water: WRI Reig et al. 2020 off-site generation water (the EcoLogits / Li et al. source).
# Primary energy: ADEME Base Empreinte via EcoLogits, MJ/kWh / 3.6.
# Leaf shape: {value, unit, tier, [min, max], source, note}
# Agent drafts from 2026-09-18, re-checked value by value against the cited sources on
# 2026-09-22 (`verified`). No human has reviewed them yet.

