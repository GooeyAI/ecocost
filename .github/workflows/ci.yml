name: CI

# Every PR, including data-only PRs from providers and researchers: the tests
# load and validate the whole knowledge base (sources, tiers, ranges, mixes).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported and newest
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install poetry==2.5.1
      - run: poetry install
      - run: poetry run pytest -q

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pipx install poetry==2.5.1
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      # catches packaging breaks (e.g. a data file left out of the wheel)
      # before a release tag does
      - run: poetry build
