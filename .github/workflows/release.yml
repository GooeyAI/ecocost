name: Release

# Publishes to PyPI when a version tag is pushed, via Trusted Publishing (OIDC):
# no API token is stored in the repo. Configure once on pypi.org under
# Publishing: owner GooeyAI, repository ecocost, workflow release.yml,
# environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.5.1
      - run: poetry install
      - run: poetry run pytest -q
      - name: Tag must match pyproject version
        run: test "v$(poetry version -s)" = "${GITHUB_REF_NAME}"
      - run: poetry build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
