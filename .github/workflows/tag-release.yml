name: Tag release

# When a merge to main changes the version in pyproject.toml, creates the tag
# and GitHub release, then starts release.yml on that tag. Does nothing if the
# tag already exists, so other pyproject.toml changes are safe.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: pipx install poetry==2.5.1
      - name: Create the tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(poetry version -s)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to do"
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "EcoCost ${version}" --generate-notes
          gh workflow run release.yml --ref "${tag}"
